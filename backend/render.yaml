# Softlligence Manufacturing Cloud — API (Render)
# PORT is injected by Render — do not hardcode it.

services:
  - type: web
    name: smc-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: APP_NAME
        value: Softlligence Manufacturing Cloud
      - key: APP_SLUG
        value: smc
      - key: APP_VERSION
        value: 0.1.0
